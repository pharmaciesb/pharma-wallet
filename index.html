<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire Remises Officine</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1a73e8; margin-bottom: 20px; font-size: 1.5rem; }
        
        .section { background: #f8f9fa; border: 1px solid #e1e4e8; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .section-title { font-weight: bold; color: #5f6368; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; }
        
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1.1rem; box-sizing: border-box; text-align: center; }
        input:focus { border-color: #1a73e8; outline: none; }
        
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:hover { background: #1557b0; }

        #result-area { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .barcode-container { background: white; padding: 15px; border: 2px solid #34a853; border-radius: 10px; margin: 15px 0; }
        
        .history { text-align: left; margin-top: 20px; font-size: 0.8rem; color: #666; max-height: 100px; overflow-y: auto; }
        .history-item { border-bottom: 1px solid #eee; padding: 5px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏷️ Remise Flash</h1>

    <div class="section">
        <div class="section-title">Saisie ou Scan Douchette</div>
        <input type="text" id="manual-code" placeholder="Entrez le code HCN..." autofocus>
        <p style="font-size: 0.7rem; color: #888; margin-top: 8px;">Tapez le code écrit sous le QR de l'affiche ou scannez directement.</p>
    </div>

    <div id="result-area">
        <div class="barcode-container">
            <svg id="barcode"></svg>
        </div>
        <div style="font-weight: bold; font-size: 1.2rem; color: #34a853;" id="display-code"></div>
        <button class="btn" style="background:#6c757d" onclick="resetForm()">Nouveau code</button>
    </div>

    <div class="history" id="history">
        <div class="section-title">Historique récent</div>
    </div>
</div>

<script>
    const input = document.getElementById('manual-code');
    const historyBox = document.getElementById('history');

    // Détection de la saisie (douchette ou clavier)
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            let val = input.value.trim();
            
            // Si c'est une URL, on essaie d'extraire le code (basique)
            if (val.includes('http')) {
                alert("L'extraction automatique est bloquée par l'affiche. Merci de saisir manuellement le code écrit en bas du QR Code.");
                input.value = '';
                return;
            }

            if (val.length > 3) {
                generateBarcode(val);
            }
        }
    });

    function generateBarcode(code) {
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('display-code').innerText = code;
        
        JsBarcode("#barcode", code, {
            format: "CODE128",
            width: 2.5,
            height: 80,
            displayValue: false
        });

        // Ajout à l'historique
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerText = `${new Date().toLocaleTimeString()} - ${code}`;
        historyBox.prepend(item);
        
        input.value = '';
    }

    function resetForm() {
        document.getElementById('result-area').style.display = 'none';
        input.focus();
    }
</script>

</body>
</html>
