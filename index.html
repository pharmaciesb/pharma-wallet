<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Extracteur de Remise Officine</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .input-group { margin-bottom: 20px; text-align: left; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        input:focus { border-color: #007bff; outline: none; }
        .log-area { background: #f8f9fa; padding: 15px; border-radius: 6px; font-size: 0.85rem; color: #555; margin-bottom: 20px; border-left: 4px solid #007bff; text-align: left; }
        .result-card { display: none; border: 3px solid #28a745; padding: 20px; border-radius: 10px; background: #f0fff4; }
        #barcode { max-width: 100%; margin-top: 10px; }
        .loading { display: none; color: #007bff; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Promo Flash Officine</h2>
    
    <div class="input-group">
        <label>Scannez ici (ou collez l'URL opn.to) :</label>
        <input type="text" id="main-input" placeholder="Attente du scan..." autofocus>
    </div>

    <div id="loader" class="loading">⏳ Analyse de la page HighCo...</div>

    <div id="logs" class="log-area" style="display:none">
        <strong>Dernières étapes :</strong><br>
        <span id="log-step"></span>
    </div>

    <div id="result" class="result-card">
        <h3 style="margin:0; color:#1e7e34;">Code : <span id="final-code"></span></h3>
        <svg id="barcode"></svg>
        <br>
        <button onclick="location.reload()" style="margin-top:15px; padding:8px 15px;">Nouveau scan</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://solitary-river-bec4.pharmaciesaintbarthelemy.workers.dev/";
    const mainInput = document.getElementById('main-input');

    mainInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const val = mainInput.value.trim();
            if (val.startsWith('http')) {
                process(val);
            } else {
                alert("Veuillez scanner une URL valide.");
                mainInput.value = '';
            }
        }
    });

    async function process(url) {
    const logStep = document.getElementById('log-step');
    const loader = document.getElementById('loader');
    
    loader.style.display = 'block';
    logStep.innerText = "Analyse en cours...";

    try {
        const response = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        console.log("Réponse du Worker :", data);

        // Sécurité : On ne boucle que si logs existe
        if (data.logs && Array.isArray(data.logs)) {
            data.logs.forEach(log => console.log("Worker Log:", log));
        }

        if (data.code) {
            showFinal(data.code); // Affiche le code et le code-barres
            logStep.innerText = "Code trouvé !";
        } else {
            logStep.innerText = data.error || "Code non détecté. Vérifiez le QR code.";
        }
    } catch (err) {
        console.error("Erreur de fetch :", err);
        logStep.innerText = "Erreur de connexion au serveur.";
    } finally {
        loader.style.display = 'none';
    }
}

    function showFinal(code) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('final-code').innerText = code;
        JsBarcode("#barcode", code, {
            format: "CODE128",
            width: 2.5,
            height: 80,
            displayValue: false
        });
    }
</script>

</body>
</html>
