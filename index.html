<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Extracteur HighCo Officine</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f9; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 6px; }
        #loader { display: none; color: #007bff; font-weight: bold; margin: 20px; }
        .result { display: none; margin-top: 20px; padding: 20px; border: 3px solid #28a745; border-radius: 10px; }
        #barcode { max-width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>Scanner Promo HighCo</h2>
    <input type="text" id="scan-input" placeholder="Scannez le QR Code ici..." autofocus>
    
    <div id="loader">⏳ Extraction du code en cours...</div>

    <div id="result" class="result">
        <h3 id="code-text" style="color:#28a745; font-size: 1.5rem;"></h3>
        <svg id="barcode"></svg>
        <br>
        <button onclick="location.reload()" style="margin-top:15px;">Nouveau scan</button>
    </div>
</div>

<script>
    const input = document.getElementById('scan-input');
    // On utilise un proxy CORS pour contourner les protections navigateur
    const PROXY = "https://corsproxy.io/?"; 

    input.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const url = input.value.trim();
            if (url.includes('http')) {
                process(url);
            }
            input.value = '';
        }
    });

    async function process(targetUrl) {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        try {
            // 1. On récupère la page opn.to via le proxy
            const res1 = await fetch(PROXY + encodeURIComponent(targetUrl));
            const html1 = await res1.text();

            // 2. On cherche le lien walletpass
            const regexUrl = /https:\/\/highcodata\.walletpass\.fr\/download\/[^"'\s>]+/g;
            const match = html1.match(regexUrl);

            if (!match) throw new Error("Lien HighCo non trouvé dans l'affiche.");

            const highCoUrl = match[0].replace(/&amp;/g, '&');
            console.log("Lien détecté :", highCoUrl);

            // 3. On récupère la page HighCo via le proxy
            const res2 = await fetch(PROXY + encodeURIComponent(highCoUrl));
            const html2 = await res2.text();

            // 4. On cherche le code HCN
            const matchHCN = html2.match(/HCN[a-zA-Z0-9]+/);
            
            if (matchHCN) {
                showResult(matchHCN[0]);
            } else {
                // Si pas de HCN, on cherche un nombre de 13 chiffres
                const matchAlt = html2.match(/[0-9]{13}/);
                if (matchAlt) showResult(matchAlt[0]);
                else throw new Error("Code promo non trouvé dans la page.");
            }
        } catch (err) {
            alert(err.message);
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function showResult(code) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('code-text').innerText = code;
        JsBarcode("#barcode", code, {
            format: "CODE128",
            displayValue: false
        });
    }
</script>
</body>
</html>
