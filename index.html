<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pharma Wallet Pro - Officine</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
        .panel-left { width: 400px; padding: 20px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .panel-right { flex-grow: 1; background: #f1f5f9; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .card { background: #334155; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; background: #0f172a; border: 2px solid #475569; color: #22c55e; border-radius: 8px; font-size: 1rem; font-family: monospace; box-sizing: border-box; }
        .btn-scan { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        .btn-scan:hover { background: #2563eb; }

        #result-area { background: white; color: #1e293b; padding: 15px; border-radius: 12px; text-align: center; display: none; margin-top: 15px; }
        #barcode { width: 100%; height: auto; }
        
        #history { flex-grow: 1; margin-top: 20px; overflow-y: auto; font-size: 0.8rem; border-top: 1px solid #334155; padding-top: 10px; }
        .hist-item { padding: 8px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; cursor: pointer; }
        .hist-item:hover { background: #334155; }
        
        #logs { font-size: 0.7rem; color: #94a3b8; font-family: monospace; max-height: 80px; overflow-y: auto; margin-top: 10px; }
        video { display: none; }
    </style>
</head>
<body>

<div class="panel-left">
    <div class="card">
        <label style="font-size: 0.75rem; font-weight: bold;">SAISIE DOUCHETTE OU CLAVIER</label>
        <input type="text" id="main-input" placeholder="Lien ou code..." autofocus>
        <button class="btn-scan" onclick="decodeDisplayedQR()">📷 ANALYSER L'ÉCRAN (QR)</button>
    </div>

    <div id="result-area">
        <div id="code-val" style="font-weight: 900; font-size: 1.5rem;"></div>
        <svg id="barcode"></svg>
    </div>

    <div id="history">
        <div style="font-weight: bold; color: #64748b; margin-bottom: 8px;">Derniers codes :</div>
        <div id="hist-list"></div>
    </div>

    <div id="logs"></div>
</div>

<div class="panel-right">
    <iframe id="target-frame"></iframe>
</div>

<video id="capture-video" autoplay></video>

<script>
    const input = document.getElementById('main-input');
    const frame = document.getElementById('target-frame');
    const resultArea = document.getElementById('result-area');
    const video = document.getElementById('capture-video');
    const histList = document.getElementById('hist-list');

    function addLog(msg, color = "") {
        const log = document.getElementById('logs');
        log.innerHTML = `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>` + log.innerHTML;
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.trim();
            if (val.startsWith('http')) {
                frame.src = val;
                addLog("Chargement de la page...", "#3b82f6");
            } else if (val.length >= 3) {
                showFinalBarcode(val);
            }
            input.value = '';
        }
    });

    function showFinalBarcode(code) {
        resultArea.style.display = 'block';
        document.getElementById('code-val').innerText = code;
        
        // On détecte le format (EAN13 si 13 chiffres, sinon CODE128)
        const isEAN = /^[0-9]{13}$/.test(code);
        JsBarcode("#barcode", code, {
            format: isEAN ? "EAN13" : "CODE128",
            width: 2,
            height: 100,
            displayValue: isEAN // Affiche les chiffres si EAN
        });

        // Ajout historique
        const item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = `<span>${code}</span> <span>${new Date().toLocaleTimeString()}</span>`;
        item.onclick = () => showFinalBarcode(code);
        histList.prepend(item);
    }

    async function decodeDisplayedQR() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                setTimeout(async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const code = jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data, canvas.width, canvas.height);
                    
                    if (code) {
                        const decodedUrl = code.data;
                        const hcnMatch = decodedUrl.match(/HCN[a-zA-Z0-9]+/);
                        if (hcnMatch) {
                            showFinalBarcode(hcnMatch[0]);
                        } else {
                            addLog("Lecture serveur...", "#eab308");
                            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(decodedUrl)}`);
                            const data = await res.json();
                            const finalMatch = data.contents.match(/HCN[a-zA-Z0-9]+/) || data.contents.match(/[0-9]{13}/);
                            if (finalMatch) showFinalBarcode(finalMatch[0]);
                            else addLog("Code introuvable dans le lien.", "#ef4444");
                        }
                    }
                    stream.getTracks().forEach(t => t.stop());
                }, 500);
            };
        } catch (e) { addLog("Erreur : " + e.message, "#ef4444"); }
    }
</script>
</body>
</html>
