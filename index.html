<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pharma - Mode Expert</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #121212; color: white; overflow: hidden; }
        .panel-left { width: 420px; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; box-sizing: border-box; background: #1e1e1e; }
        .panel-right { flex-grow: 1; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 15px; background: #2d2d2d; border: 2px solid #3d3d3d; color: #00ff00; border-radius: 8px; font-size: 1.1rem; font-family: monospace; box-sizing: border-box; }
        input:focus { border-color: #007bff; outline: none; }
        .btn-scan { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; font-size: 1rem; }
        .btn-scan:hover { background: #0056b3; }
        #result-area { margin-top: 10px; padding: 15px; background: white; color: black; border-radius: 12px; text-align: center; display: none; border: 4px solid #28a745; }
        #barcode { width: 100%; max-height: 120px; }
        #logs { flex-grow: 1; margin-top: 20px; background: #000; padding: 10px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.75rem; overflow-y: auto; border: 1px solid #333; }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #1a1a1a; padding-bottom: 2px; }
        .log-success { color: #28a745; }
        .log-error { color: #ff4d4d; }
        .log-info { color: #00d4ff; }
        video { display: none; } /* On cache la vidéo de capture */
    </style>
</head>
<body>

<div class="panel-left">
    <h2>🚀 Pharma Scan</h2>
    
    <div class="input-group">
        <label style="font-size: 0.8rem; color: #888;">SCANNER OU TAPER CODE :</label>
        <input type="text" id="main-input" placeholder="Lien ou code HCN..." autofocus>
    </div>

    <button class="btn-scan" onclick="decodeDisplayedQR()">📷 DÉCODER LE QR À L'ÉCRAN</button>

    <div id="result-area">
        <div id="code-val" style="font-weight: 900; font-size: 1.4rem; margin-bottom: 5px;"></div>
        <svg id="barcode"></svg>
    </div>

    <div id="logs">
        <div class="log-info">[Système] Prêt pour le scan.</div>
    </div>
</div>

<div class="panel-right">
    <iframe id="target-frame" name="target-frame"></iframe>
    <div id="placeholder" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ccc; text-align: center;">
        L'affiche HighCo apparaîtra ici
    </div>
</div>

<video id="capture-video" autoplay></video>

<script>
    const input = document.getElementById('main-input');
    const logsContainer = document.getElementById('logs');
    const frame = document.getElementById('target-frame');
    const resultArea = document.getElementById('result-area');
    const video = document.getElementById('capture-video');

    function addLog(msg, type = '') {
        const line = document.createElement('div');
        line.className = `log-line log-${type}`;
        line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logsContainer.prepend(line);
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.trim();
            if (val.startsWith('http')) {
                addLog("Lien détecté, chargement...", "info");
                document.getElementById('placeholder').style.display = 'none';
                frame.src = val;
            } else if (val.length >= 3) {
                showFinalBarcode(val);
            }
            input.value = '';
        }
    });

    function showFinalBarcode(code) {
        resultArea.style.display = 'block';
        const cleanCode = code.toUpperCase();
        document.getElementById('code-val').innerText = cleanCode;
        JsBarcode("#barcode", cleanCode, {
            format: "CODE128",
            width: 2,
            height: 80,
            displayValue: false
        });
        addLog("Barcode généré : " + cleanCode, "success");
    }

    async function decodeDisplayedQR() {
        addLog("Demande d'accès au flux vidéo...", "info");
        
        try {
            // Capture d'écran universelle
            const stream = await navigator.mediaDevices.getDisplayMedia({ 
                video: { displaySurface: "browser" } 
            });
            
            video.srcObject = stream;

            // On attend que la vidéo soit prête
            video.onloadedmetadata = () => {
                addLog("Analyse de l'image en cours...", "info");
                
                // On attend un court instant que le flux soit stable
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code) {
                        addLog("QR détecté visuellement !", "success");
                        const hcnMatch = code.data.match(/HCN[a-zA-Z0-9]+/);
                        if (hcnMatch) {
                            showFinalBarcode(hcnMatch[0]);
                        } else {
                            addLog("Lien trouvé mais pas de HCN. Lien : " + code.data.substring(0, 30), "error");
                        }
                    } else {
                        addLog("Aucun QR Code trouvé. Vérifiez que le QR est bien visible à l'écran.", "error");
                    }

                    // Nettoyage du flux
                    stream.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }, 500);
            };

        } catch (err) {
            addLog("Erreur : " + err.message, "error");
        }
    }
</script>

</body>
</html>
