<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scanner Promo Officine - Mode Douchette</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #eceff1; padding: 40px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; font-size: 0.8rem; margin-bottom: 20px; }
        #scan-input { position: absolute; left: -9999px; } /* Champ caché pour capturer la douchette */
        #loader { display: none; margin: 20px; font-weight: bold; color: #007bff; }
        #result-area { display: none; }
        .barcode-box { background: #f8f9fa; border: 3px solid #28a745; padding: 30px; border-radius: 15px; margin: 20px 0; }
        .instruction { color: #546e7a; font-size: 1.1rem; }
    </style>
</head>
<body onclick="focusInput()">

<div class="card">
    <div class="status-badge">● Prêt à scanner</div>
    <h1>Système Remise Flash</h1>
    <p class="instruction">Flashez le QR code de l'affiche avec votre douchette</p>
    
    <input type="text" id="scan-input" autofocus autocomplete="off">

    <div id="loader">🔄 Traitement HighCo en cours...</div>

    <div id="result-area">
        <h2 style="color: #2e7d32;">CODE GÉNÉRÉ : <span id="text-code"></span></h2>
        <div class="barcode-box">
            <svg id="barcode"></svg>
        </div>
        <p style="color: #666;">Scannez ce code avec votre douchette pour appliquer la remise</p>
        <button onclick="resetApp()" style="margin-top:20px; padding:10px 20px; cursor:pointer;">Scanner un autre</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://solitary-river-bec4.pharmaciesaintbarthelemy.workers.dev/";
    const input = document.getElementById('scan-input');

    // Garder le focus sur l'input en permanence pour la douchette
    function focusInput() { input.focus(); }
    document.addEventListener('click', focusInput);

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const scannnedUrl = input.value;
            if (scannnedUrl.includes('http')) {
                processUrl(scannnedUrl);
            }
            input.value = ''; // On vide pour le suivant
        }
    });

    async function processUrl(url) {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';

        try {
            const response = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.code && data.code !== "Non trouvé") {
                showResult(data.code);
            } else {
                alert("Erreur : Impossible d'extraire le code.");
                resetApp();
            }
        } catch (err) {
            alert("Erreur de connexion au Worker.");
            resetApp();
        }
    }

    function showResult(code) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('text-code').innerText = code;

        JsBarcode("#barcode", code, {
            format: "CODE128",
            width: 3,
            height: 100,
            displayValue: false
        });
    }

    function resetApp() {
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('loader').style.display = 'none';
        input.focus();
    }
</script>
</body>
</html>
