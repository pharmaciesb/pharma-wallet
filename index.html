<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Scanner Promo - Officine</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; text-align: center; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .input-area { margin: 20px 0; }
        input { width: 80%; padding: 12px; font-size: 1.2rem; border: 2px solid #007bff; border-radius: 8px; text-align: center; }
        #barcode-result { display: none; margin-top: 20px; padding: 20px; border: 2px dashed #28a745; background: #fafffa; }
        .debug-panel { margin-top: 30px; font-size: 0.7rem; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
        .btn-debug { background: none; border: 1px solid #ccc; color: #999; cursor: pointer; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Remise Flash V1</h2>
    <p>Scannez l'affiche ou tapez le code HCN</p>
    
    <div class="input-area">
        <input type="text" id="main-input" placeholder="HCN..." autofocus>
    </div>

    <div id="barcode-result">
        <strong id="code-display" style="font-size: 1.5rem; color: #28a745;"></strong><br>
        <svg id="barcode"></svg>
    </div>

    <div class="debug-panel">
        <button class="btn-debug" onclick="toggleDebug()">⚙️ Mode Diagnostic (Logs)</button>
        <div id="debug-status" style="margin-top:5px;"></div>
    </div>
</div>

<script>
    const input = document.getElementById('main-input');
    const PROXY = "https://corsproxy.io/?"; 
    const WORKER_URL = "https://solitary-river-bec4.pharmaciesaintbarthelemy.workers.dev/";

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.trim();
            if (val.startsWith('http')) {
                runDiagnostic(val);
                // On informe l'utilisateur mais on lance les logs en arrière-plan
                alert("Lien détecté. Tentative d'extraction en cours dans la console (F12). Si rien ne s'affiche, tapez le code manuellement.");
                input.value = '';
            } else if (val.length > 2) {
                showBarcode(val);
                input.value = '';
            }
        }
    });

    // Affiche le code-barres immédiatement
    function showBarcode(code) {
        document.getElementById('barcode-result').style.display = 'block';
        document.getElementById('code-display').innerText = code.toUpperCase();
        JsBarcode("#barcode", code.toUpperCase(), {
            format: "CODE128",
            width: 2,
            height: 80,
            displayValue: false
        });
    }

    // Fonction de log pour nous deux
    async function runDiagnostic(url) {
        const status = document.getElementById('debug-status');
        status.innerText = "⏳ Diagnostic en cours...";
        console.log("%c--- DEBUT DIAGNOSTIC ---", "color: blue; font-weight: bold;");
        console.log("URL scannée :", url);

        try {
            // Test via le Worker avec logs activés
            const response = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            
            console.log("Retour Worker :", data);
            
            if (data.html_debug) {
                console.log("Contenu HTML intercepté (Extraits) :", data.html_debug);
            }

            if (data.code) {
                console.log("%cSUCCÈS : Code trouvé -> " + data.code, "color: green; font-weight: bold;");
                showBarcode(data.code);
                status.innerText = "✅ Succès !";
            } else {
                console.warn("ÉCHEC : Le code n'a pas été trouvé dans le flux.");
                status.innerText = "❌ Échec (voir F12)";
            }
        } catch (err) {
            console.error("ERREUR RÉSEAU :", err);
            status.innerText = "❌ Erreur de connexion au Worker";
        }
    }

    function toggleDebug() {
        alert("Les logs détaillés sont envoyés dans la console du navigateur. Appuyez sur F12 pour les consulter.");
    }
</script>
</body>
</html>
