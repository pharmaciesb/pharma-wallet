<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Extracteur de Remise</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; text-align: center; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 12px; font-size: 1.1rem; border: 2px solid #007bff; border-radius: 8px; margin: 15px 0; }
        #status { font-size: 0.8rem; color: #666; margin-bottom: 10px; }
        #result { display: none; margin-top: 20px; border: 2px solid #28a745; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Scanner Promo v2</h2>
    <input type="text" id="scan-input" placeholder="Scannez ou tapez le code..." autofocus>
    <div id="status">En attente de scan...</div>

    <div id="result">
        <h3 id="code-val" style="color:#28a745; margin:0;"></h3>
        <svg id="barcode"></svg>
    </div>
</div>

<script>
    const input = document.getElementById('scan-input');
    const status = document.getElementById('status');

    input.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const val = input.value.trim();
            if (val.startsWith('http')) {
                analyzeUrl(val);
            } else if (val.length > 2) {
                showBarcode(val);
            }
            input.value = '';
        }
    });

    async function analyzeUrl(url) {
        status.innerText = "⏳ Analyse du lien...";
        console.log("--- TENTATIVE D'EXTRACTION ---");
        
        // On utilise AllOrigins (plus puissant pour le contenu dynamique)
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

        try {
            const response = await fetch(proxyUrl);
            const data = await response.json();
            const html = data.contents; // AllOrigins met le HTML dans 'contents'

            console.log("HTML de opn.to reçu (" + html.length + " caractères)");

            // Recherche de l'URL HighCo
            const highCoMatch = html.match(/https:\/\/highcodata\.walletpass\.fr\/download\/[a-zA-Z0-9?=%&-_.]+/);

            if (highCoMatch) {
                const cleanUrl = highCoMatch[0].replace(/&amp;/g, '&');
                status.innerText = "⏳ Lien HighCo trouvé, lecture du code...";
                console.log("URL HighCo détectée :", cleanUrl);

                // Deuxième saut vers HighCo
                const res2 = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(cleanUrl)}`);
                const data2 = await res2.json();
                const html2 = data2.contents;

                console.log("HTML de HighCo reçu (" + html2.length + " caractères)");

                // Recherche du code HCN ou 13 chiffres
                const codeMatch = html2.match(/HCN[a-zA-Z0-9]+/) || html2.match(/[0-9]{13}/);

                if (codeMatch) {
                    showBarcode(codeMatch[0]);
                    status.innerText = "✅ Succès !";
                } else {
                    console.log("Début du HTML HighCo pour debug :", html2.substring(0, 500));
                    throw new Error("Code non trouvé dans la page finale.");
                }
            } else {
                console.log("Début du HTML opn.to pour debug :", html.substring(0, 500));
                throw new Error("Lien HighCo introuvable dans l'affiche.");
            }
        } catch (err) {
            status.innerText = "❌ " + err.message;
            console.error(err);
        }
    }

    function showBarcode(code) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('code-val').innerText = code.toUpperCase();
        JsBarcode("#barcode", code.toUpperCase(), {
            format: "CODE128",
            width: 2,
            height: 80,
            displayValue: false
        });
    }
</script>
</body>
</html>
